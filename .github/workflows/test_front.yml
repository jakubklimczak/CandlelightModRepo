name: Tests - Frontend

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd candlelight.client
          npm install

      - name: Run frontend tests (Karma + Jasmine)
        run: |
          cd candlelight.client
          npm run test -- --watch=false --browsers=FirefoxHeadless
